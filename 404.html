<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Security: CSP + referrer policy delivered via <meta>; GitHub Pages cannot send custom HTTP headers. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#2A2A25" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FAF5EE" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, follow">
<title>Page not found · Ember &amp; Frames</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300;1,9..40,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --off-white: #FAF5EE; --warm: #ECDFC4; --olive: #5C6B3A; --gold: #C9A84C; --charcoal: #2A2A25; --muted: #6B6B60; }
  html, body { height: 100%; }
  body {
    background: var(--off-white); color: var(--charcoal);
    font-family: 'DM Sans', sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 24px; min-height: 100dvh;
  }
  main { text-align: center; max-width: 520px; }
  .code { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: clamp(72px, 14vw, 120px); color: var(--olive); line-height: 1; }
  h1 { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: clamp(28px, 4vw, 40px); letter-spacing: -0.3px; margin: 12px 0 16px; }
  p { color: var(--muted); font-size: 15px; line-height: 1.6; margin-bottom: 32px; }
  a.btn {
    display: inline-block; padding: 14px 32px;
    background: var(--charcoal); color: var(--off-white);
    text-decoration: none; font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
    transition: background 0.2s;
  }
  a.btn:hover { background: var(--olive); }
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>This frame doesn&rsquo;t exist.</h1>
  <p>The page you&rsquo;re looking for has moved, been renamed, or never existed. Head back to the index to find what you&rsquo;re after.</p>
  <a class="btn" href="/">Return home</a>
</main>
</body>
</html>
